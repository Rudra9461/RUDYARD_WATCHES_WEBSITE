<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up — Rudyard Watches</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assest/css/style.css">
</head>
<body class="rw-form-page">

  <div class="rw-form-card">
    <a href="index.html" style="display:block;text-align:center;margin-bottom:24px;">
      <img src="assest/images/images-removebg-preview.png" height="48" alt="Rudyard Watches" style="filter:brightness(10);opacity:0.9;">
    </a>
    <h2 class="rw-form-title">Create Account</h2>
    <p class="rw-form-subtitle">Join Rudyard Watches — where time meets elegance</p>
    <div class="rw-form-rule"></div>

    <form id="myform" action="submit.php" method="POST" novalidate>

      <div class="rw-field">
        <label class="rw-label" for="fname">First Name</label>
        <input type="text" class="rw-input" id="fname" name="fname" placeholder="Enter first name" autocomplete="given-name">
        <span class="rw-error" id="fname_error"></span>
      </div>

      <div class="rw-field">
        <label class="rw-label" for="lname">Last Name</label>
        <input type="text" class="rw-input" id="lname" name="lname" placeholder="Enter last name" autocomplete="family-name">
        <span class="rw-error" id="lname_error"></span>
      </div>

      <div class="rw-field">
        <label class="rw-label" for="contact">Contact Number</label>
        <input type="tel" class="rw-input" id="contact" name="contact" placeholder="10-digit mobile number" maxlength="10" autocomplete="tel">
        <span class="rw-error" id="contact_error"></span>
      </div>

      <div class="rw-field">
        <label class="rw-label" for="email">Email Address</label>
        <input type="email" class="rw-input" id="email" name="email" placeholder="you@example.com" autocomplete="email">
        <span class="rw-error" id="email_error"></span>
      </div>

      <div class="rw-field">
        <label class="rw-label" for="password">Password</label>
        <input type="password" class="rw-input" id="password" name="password" placeholder="Min. 6 characters" autocomplete="new-password">
        <span class="rw-strength" id="password_strength"></span>
        <span class="rw-error" id="password_error"></span>
      </div>

      <div class="rw-field">
        <label class="rw-label" for="address">Address</label>
        <input type="text" class="rw-input" id="address" name="address" placeholder="Enter your address" autocomplete="street-address">
        <span class="rw-error" id="address_error"></span>
      </div>

      <div class="rw-field">
        <label class="rw-label" for="pin_code">PIN Code</label>
        <input type="tel" class="rw-input" id="pin_code" name="pin_code" placeholder="6-digit PIN code" maxlength="6">
        <span class="rw-error" id="pin_code_error"></span>
      </div>

      <button type="submit" class="rw-submit-btn" id="submit_btn">Register Now</button>

    </form>

    <p style="text-align:center;margin-top:20px;font-size:13px;color:#9aabb8;">
      Already have an account? <a href="index.html" style="color:#c9a84c;text-decoration:none;">Back to home</a>
    </p>
  </div>

  <!-- jQuery then style.js — both at bottom of body -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="assest/js/style.js"></script>
</body>
</html>
